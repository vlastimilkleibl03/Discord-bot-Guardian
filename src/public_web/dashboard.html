<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord bot Guardian</title>

    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div id="loading">
        Loading...
    </div>

    <div id="dashboard" hidden>
        <div id="navbar">
            <h1>Dashboard</h1>
            <select id="guild_select"></select>
            <div id="nav_right">
                <h1><span id="username"></span></h1>
                <a id="logout_button" href="/logout">Log out</a>
            </div>
        </div>
    </div>

    <div id="error" hidden>
        <h1>Error</h1>
        <p id="error_description">Unlogged user, please log in to display your account.</p>
        <a id="login_button" href="/auth/discord">Log in</a>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
